      <div style="flex:1;min-width:0">
        <div style="font-size:13.5px;font-weight:600">${esc(titulo)}</div>
        ${detalhe?`<div class="text-sm text-muted">${esc(detalhe)}</div>`:''}
      </div>
      ${valor?`<div class="fw6 num" style="white-space:nowrap">${valor}</div>`:''}
    </div>`;

  const grupo=(rotulo,itens)=>itens.length?`<div class="ctitle" style="margin:16px 0 2px">${rotulo}</div>${itens.join('')}`:'';

  const blocos=[
    grupo('Shows', vShows.map(s=>linha(AG_CORES.show,'🎸 '+s.banda,
      [s.hora?'Às '+s.hora:'',s.obs||''].filter(Boolean).join(' · '),
      s.cache>0?`<span class="valor-pag">${esc(fBRL(s.cache))}</span>`:''))),
    grupo('Compromissos', vComps.map(c=>linha(AG_CORES.comp,c.titulo||'Compromisso',
      [c.inicio?c.inicio.slice(11,16)+(c.fim?' às '+c.fim.slice(11,16):''):'',c.local||'',c.descricao||''].filter(Boolean).join(' · '),''))),
    grupo('Vencimentos', vVenc.map(l=>linha(AG_CORES[l.tipo],
      (l.tipo==='receber'?'A receber: ':'A pagar: ')+l.descricao,
      l.categoria||'',
      `<span class="${l.tipo==='receber'?'valor-rec':'valor-pag'}">${esc(fBRL(l.valor))}</span>`)))
  ].filter(Boolean).join('');

  $('dia-body').innerHTML = blocos
    ? blocos + (ocultos?`<div class="text-sm" style="color:var(--amber);margin-top:12px">${ocultos} item(ns) escondido(s) pelas etiquetas do calendário.</div>`:'')
    : `<div class="vazio">Nada marcado neste dia.${ocultos?`<br><span style="color:var(--amber)">${ocultos} item(ns) escondido(s) pelas etiquetas.</span>`:''}</div>`;
  openM('m-dia');
}

// ── Compromissos avulsos ──
function abrirComp(id,dataISO){
  const c=id?getComps().find(x=>x.id===id):null;
  $('comp-titulo').textContent=c?'Editar compromisso':'Novo compromisso';
  $('comp-body').innerHTML=`
    <input type="hidden" id="cp-id" value="${esc(c?c.id:'')}">
    <div class="fgroup"><label>O que é *</label>
      <input type="text" id="cp-titulo" placeholder="Ex: Entrega da distribuidora" value="${c?esc(c.titulo):''}">
    </div>
    <div class="frow c2">
      <div class="fgroup"><label>Começa *</label>
        <input type="datetime-local" id="cp-ini" value="${c?esc(c.inicio):(dataISO?dataISO+'T18:00':'')}">
      </div>
      <div class="fgroup"><label>Termina</label>
        <input type="datetime-local" id="cp-fim" value="${c?esc(c.fim||''):''}">
      </div>
    </div>
    <div class="fgroup"><label>Local</label><input type="text" id="cp-local" value="${c?esc(c.local||''):''}"></div>
    <div class="fgroup"><label>Descrição</label><textarea id="cp-desc" rows="2">${c?esc(c.descricao||''):''}</textarea></div>
    ${c?'<button class="btn btn-d btn-sm" id="btn-excluir-comp">Excluir compromisso</button>':''}`;
  openM('m-comp');
  if(c)$('btn-excluir-comp').addEventListener('click',()=>{
    if(!confirm('Excluir este compromisso?'))return;
    setComps(getComps().filter(x=>x.id!==c.id));
    closeM('m-comp');toast('Compromisso excluído.');renderAgenda();
  });
}

$('btn-salvar-comp').addEventListener('click',()=>{
  const id=v('cp-id'),titulo=v('cp-titulo'),ini=v('cp-ini');
  if(!titulo){toast('Diga o que é o compromisso.',true);return;}
  // Sem data de início o compromisso não teria onde aparecer no calendário
  if(!ini){toast('Informe quando começa.',true);return;}
  const dados={titulo,inicio:ini,fim:v('cp-fim'),local:v('cp-local'),descricao:v('cp-desc'),atualizadoEm:agora()};
  const cs=getComps();
  if(id){const c=cs.find(x=>x.id===id);if(c)Object.assign(c,dados);}
  else cs.push({id:uid('c'),criadoEm:agora(),...dados});
  setComps(cs);
  closeM('m-comp');
  toast('Compromisso salvo.');
  renderAgenda();
});

// ═══════════════════════════════════════════════
// SHOWS
// ═══════════════════════════════════════════════
function renderShows(){
  const hoje=hojeISO();
  const todos=getShows().slice().sort((a,b)=>b.data.localeCompare(a.data));
  const proximos=todos.filter(s=>s.data>=hoje).reverse();
  const passados=todos.filter(s=>s.data<hoje);
  const ym=ymAtual();
  const cacheMes=todos.filter(s=>s.data.startsWith(ym)).reduce((s,x)=>s+(x.cache||0),0);

  const linha=s=>{
    const lanc=s.lancamentoId?getLanc().find(l=>l.id===s.lancamentoId):null;
    return `<tr>
      <td class="num">${esc(fmtData(s.data))}${s.hora?`<div class="text-sm text-muted">${esc(s.hora)}</div>`:''}</td>
      <td><strong>${esc(s.banda)}</strong>${s.obs?`<div class="text-sm text-muted">${esc(s.obs)}</div>`:''}</td>
      <td class="num fw6 valor-pag" style="text-align:right">${s.cache>0?esc(fBRL(s.cache)):'—'}</td>
      <td>${s.cache>0?(lanc?(lanc.pago?'<span class="bdg bv">Cachê pago</span>':'<span class="bdg bam">Cachê em aberto</span>'):'<span class="bdg bcz">Sem lançamento</span>'):'<span class="bdg bcz">Sem cachê</span>'}</td>
      <td style="white-space:nowrap;text-align:right">
        <button class="btn btn-sm btn-s" data-edshow="${esc(s.id)}">✎</button>
        <button class="btn btn-sm btn-d" data-exshow="${esc(s.id)}">✕</button>
      </td>
    </tr>`;
  };
  const tabela=(lista,vazio)=>lista.length
    ?`<div class="twrap"><table>
        <thead><tr><th>Data</th><th>Banda / atração</th><th style="text-align:right">Cachê</th><th>Situação</th><th></th></tr></thead>
        <tbody>${lista.map(linha).join('')}</tbody>
      </table></div>`
    :`<div class="vazio" style="padding:32px">${vazio}</div>`;

  $('main').innerHTML=`
    <div class="ph">
      <div><h1>Shows</h1><p>${esc(fBRL(cacheMes))} em cachê neste mês</p></div>
      <button class="btn btn-p" id="btn-novo-show">+ Novo show</button>
    </div>
    <div class="card" style="padding:0;margin-bottom:16px">
      <div class="ctitle" style="padding:16px 18px 0">Próximos</div>
      ${tabela(proximos,'Nenhum show marcado. Marque o próximo e o cachê já entra no financeiro.')}
    </div>
    <div class="card" style="padding:0">
      <div class="ctitle" style="padding:16px 18px 0">Já aconteceram</div>
      ${tabela(passados.slice(0,20),'Nenhum show passado registrado.')}
    </div>`;

  $('btn-novo-show').addEventListener('click',()=>abrirShow(null));
  $('main').querySelectorAll('[data-edshow]').forEach(b=>b.addEventListener('click',()=>abrirShow(b.dataset.edshow)));
  $('main').querySelectorAll('[data-exshow]').forEach(b=>b.addEventListener('click',()=>excluirShow(b.dataset.exshow)));
}

function abrirShow(id){
  const s=id?getShows().find(x=>x.id===id):null;
  $('show-titulo').textContent=s?'Editar show':'Novo show';
  $('show-body').innerHTML=`
    <input type="hidden" id="sh-id" value="${esc(s?s.id:'')}">
    <div class="fgroup"><label>Banda / atração *</label>
      <input type="text" id="sh-banda" placeholder="Ex: Leo Borel" value="${s?esc(s.banda):''}">
    </div>
    <div class="frow c2">
      <div class="fgroup"><label>Data *</label><input type="date" id="sh-data" value="${s?esc(s.data):''}"></div>
      <div class="fgroup"><label>Hora</label><input type="time" id="sh-hora" value="${s?esc(s.hora||''):'21:00'}"></div>
    </div>
    <div class="fgroup"><label>Cachê (R$)</label>
      <input type="number" id="sh-cache" step="0.01" min="0" placeholder="0,00" value="${s&&s.cache?esc(s.cache):''}">
      <div class="text-sm text-muted" style="margin-top:5px">Com valor preenchido, entra sozinho em Contas a pagar com vencimento no dia do show.</div>
    </div>
    <div class="fgroup"><label>Observação</label>
      <input type="text" id="sh-obs" placeholder="Ex: leva som próprio" value="${s?esc(s.obs||''):''}">
    </div>`;
  openM('m-show');
  setTimeout(()=>$('sh-banda').focus(),50);
}

$('btn-salvar-show').addEventListener('click',()=>{
  const id=v('sh-id'),banda=v('sh-banda'),data=v('sh-data'),hora=v('sh-hora'),cache=nv('sh-cache'),obs=v('sh-obs');
  if(!banda){toast('Informe a banda ou atração.',true);return;}
  if(!data){toast('Informe a data do show.',true);return;}

  const shows=getShows();
  let s=id?shows.find(x=>x.id===id):null;
  if(s)Object.assign(s,{banda,data,hora,cache,obs,atualizadoEm:agora()});
  else{s={id:uid('s'),banda,data,hora,cache,obs,lancamentoId:null,criadoEm:agora(),atualizadoEm:agora()};shows.push(s);}

  // Cachê vira conta a pagar com vencimento no dia do show.
  // Editar o show atualiza o lançamento; zerar o cachê remove, desde que ainda
  // não tenha sido pago — cachê já pago é histórico e não se apaga sozinho.
  const lancs=getLanc();
  const lanc=s.lancamentoId?lancs.find(l=>l.id===s.lancamentoId):null;
  if(cache>0){
    if(lanc){
      if(lanc.pago){
        toast('Cachê já pago: o valor do lançamento não foi alterado.');
      }else{
        Object.assign(lanc,{valor:cache,descricao:'Cachê — '+banda,vencimento:data,atualizadoEm:agora()});
      }
    }else{
      const novo={
        id:uid('l'),tipo:'pagar',valor:cache,descricao:'Cachê — '+banda,
        categoria:CAT_CACHE,forma:'PIX',vencimento:data,
        totalParcelas:1,parcelaAtual:1,grupoId:null,
        pago:false,dataPagamento:null,cliente:'',showId:s.id,
        obs:'Gerado pela agenda de shows',origem:'show',
        criadoEm:agora(),atualizadoEm:agora()
      };
      lancs.push(novo);
      s.lancamentoId=novo.id;
    }
  }else if(lanc&&!lanc.pago){
    lancs.splice(lancs.indexOf(lanc),1);
    s.lancamentoId=null;
  }
  setLanc(lancs);
  setShows(shows);
  addHist('Show: '+banda,fmtData(data));
  closeM('m-show');
  toast(cache>0?'Show salvo e cachê lançado no financeiro.':'Show salvo.');
  navTo(APP.tela);
});

function excluirShow(id){
  const shows=getShows();
  const s=shows.find(x=>x.id===id);
  if(!s)return;
  const lancs=getLanc();
  const lanc=s.lancamentoId?lancs.find(l=>l.id===s.lancamentoId):null;
  let msg='Excluir o show de "'+s.banda+'"?';
  if(lanc&&!lanc.pago)msg+='\n\nO lançamento do cachê também será removido.';
  if(lanc&&lanc.pago)msg+='\n\nO cachê já foi pago e vai continuar no financeiro.';
  if(!confirm(msg))return;
  if(lanc&&!lanc.pago){lancs.splice(lancs.indexOf(lanc),1);setLanc(lancs);}
  setShows(shows.filter(x=>x.id!==id));
  addHist('Excluiu show: '+s.banda);
  toast('Show excluído.');
  navTo(APP.tela);
}

// ALTERAR SENHA
// ═══════════════════════════════════════════════
$('btn-alterar-senha').addEventListener('click',()=>{
  $('udrop').classList.add('hidden');
  $('sn-atual').value='';$('sn-nova').value='';$('sn-nova2').value='';$('sn-erro').textContent='';
  openM('m-senha');
});
$('btn-salvar-senha').addEventListener('click',async()=>{
  const atual=$('sn-atual').value,nova=$('sn-nova').value,nova2=$('sn-nova2').value;
  const erro=$('sn-erro');erro.textContent='';
  if(nova.length<8){erro.textContent='A nova senha precisa ter pelo menos 8 caracteres.';return;}
  if(nova!==nova2){erro.textContent='As duas senhas não são iguais.';return;}
  const btn=$('btn-salvar-senha');btn.disabled=true;btn.textContent='Alterando...';
  try{
    // Reautentica antes: o Firebase exige login recente pra trocar a senha
    const cred=firebase.auth.EmailAuthProvider.credential(auth.currentUser.email,atual);
    await auth.currentUser.reauthenticateWithCredential(cred);
    await auth.currentUser.updatePassword(nova);
    closeM('m-senha');
    toast('Senha alterada.');
  }catch(e){
    erro.textContent=e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'
      ?'A senha atual está incorreta.':'Erro: '+e.message;
  }finally{btn.disabled=false;btn.textContent='Alterar';}
});

// BACKUP
// ═══════════════════════════════════════════════
$('btn-backup').addEventListener('click',async()=>{
  $('udrop').classList.add('hidden');
  $('backup-body').innerHTML='<div class="vazio">Carregando cópias...</div>';
  openM('m-backup');
  try{
    const snap=await db.collection('backups').orderBy('data','desc').limit(30).get();
    if(snap.empty){$('backup-body').innerHTML='<div class="vazio">Nenhuma cópia automática ainda. A primeira é criada assim que houver dados.</div>';return;}
    $('backup-body').innerHTML=`
      <div class="text-sm text-muted" style="margin-bottom:14px">Uma cópia automática por dia, guardando os últimos 30 dias. Restaurar substitui os dados atuais pelos do dia escolhido.</div>
      ${snap.docs.map(d=>`
        <div class="flex justify-between items-center" style="padding:9px 0;border-bottom:1px solid var(--border)">
          <div>
            <strong class="num">${esc(fmtData(d.id))}</strong>
            <div class="text-sm text-muted">por ${esc(d.data().por||'—')}</div>
          </div>
          <button class="btn btn-sm btn-s" data-restaurar="${esc(d.id)}">Restaurar</button>
        </div>`).join('')}`;
    $('backup-body').querySelectorAll('[data-restaurar]').forEach(b=>b.addEventListener('click',()=>restaurarBackup(b.dataset.restaurar)));
  }catch(e){
    $('backup-body').innerHTML='<div class="vazio">Não foi possível carregar as cópias ('+esc(e.message)+').</div>';
  }
});

async function restaurarBackup(dia){
  if(!PODE_GRAVAR_NUVEM){toast('Cópia local: restaurar está desligado.',true);return;}
  if(!confirm(`Restaurar os dados do dia ${fmtData(dia)}?\n\nTudo que foi lançado DEPOIS desse dia será perdido.`))return;
  try{
    const doc=await db.collection('backups').doc(dia).get();
    if(!doc.exists){toast('Cópia não encontrada.',true);return;}
    const dados=doc.data().dados||{};
    Object.entries(dados).forEach(([chave,valorStr])=>{
      if(!FS_KEYS.includes(chave))return;
      localStorage.setItem('kb_'+chave,valorStr);
    });
    // Envia o estado restaurado pra nuvem sem passar pela mesclagem, que traria
    // de volta justamente o que se quer descartar
    await Promise.all(FS_KEYS.map(async k=>{
      const raw=localStorage.getItem('kb_'+k);
      if(raw==null)return;
      await db.collection('appData').doc(k).set({data:JSON.parse(raw),ts:firebase.firestore.FieldValue.serverTimestamp()});
      fsUltimaSync[k]=Date.now();
    }));
    reloadCats();
    closeM('m-backup');
    toast('Dados restaurados de '+fmtData(dia));
    navTo('painel');
  }catch(e){toast('Erro ao restaurar: '+e.message,true);}
}

$('btn-baixar-json').addEventListener('click',()=>{
  const dados={};
  FS_KEYS.forEach(k=>dados[k]=ls.g(k,null));
  const blob=new Blob([JSON.stringify({gerado:agora(),dados},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='komboza-backup-'+hojeISO()+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Cópia baixada.');
});
