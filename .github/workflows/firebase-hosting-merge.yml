name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # public/sistema/index.html é gerado aqui a partir da fonte, por isso não
      # é versionado. Editar o arquivo gerado não tem efeito: ele é sobrescrito.
      - name: Monta a pasta public/sistema a partir da fonte
        run: |
          mkdir -p public/sistema
          cp sistema-komboza.html public/sistema/index.html

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KOMBOZABAR_1AA4A }}
          channelId: live
          projectId: kombozabar-1aa4a

# ATENÇÃO: as regras do Firestore (firestore.rules) NÃO sobem neste deploy.
# A conta de serviço do GitHub só tem permissão de Hosting; publicar regras por
# aqui devolve 403 na API firebaserules.googleapis.com.
#
# Depois de mexer no firestore.rules, publique à mão:
#     npx firebase-tools@latest deploy --only firestore:rules --project kombozabar-1aa4a
# e confirme o que ficou no ar antes de considerar feito.
#
# Para automatizar: conceda à conta de serviço do GitHub o papel
# "Firebase Rules Admin" no IAM do projeto e traga o passo de volta.
